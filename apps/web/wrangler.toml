# Cloudflare PAGES config (this is a static Next.js export → Pages, not Workers).
#
# The Next app statically exports to apps/web/out (output: 'export'). Pages serves
# those files directly — there is no server/Worker, which keeps the "no runtime
# backend, we store nothing" guarantee true at the infra level.
#
# Git-integration dashboard settings (match these):
#   Root directory (advanced):   apps/web
#   Build command:               bunx next build
#   Build output directory:      out
#
# CLI deploy (from apps/web): `bunx wrangler pages deploy`
name = "atmabal"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"
